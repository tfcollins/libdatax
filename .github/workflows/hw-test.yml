# Hardware suite (tests/hardware) on real boards: dispatched, plus weekly so the
# support-matrix rows that cite this workflow never go stale (30 days).
#
# This is a public repository, so the self-hosted lab runners are locked down:
# - Fork pull requests need approval for every external contributor.
# - Each runner has a job-started hook (outside this repository) that refuses any
#   job other than this workflow on refs/heads/main, triggered by
#   workflow_dispatch or schedule, by the owner.
# - No pull_request or push trigger may be added here.
#
# Host facts (coordinator, addresses, artifact paths) live in the runner's .env,
# never in this file. Session logs and artifacts are redacted (scripts/hw/redact.py)
# before they are printed or uploaded.
#
# Every job runs on the hw-nemo runner and reaches the boards through labgrid:
#   tron   ADRV9009-ZU11EG. Two boots, one per pinned image in
#          tests/hardware/images.json: stock (P2 streaming incl. TX and loopback)
#          and hopcap-sfp (P3a timed control). scripts/hw/tron-run.sh.
#   kuiper The other lab boards libdatax drives, on the labgrid catalog's Kuiper
#          image (adi-lg request --mode uri). scripts/hw/kuiper-run.sh.
#            zc706  ADRV9009 on ZC706 (place nemo)
#            lablp  ADRV9361-Z7035 on ADRV1CRR-FMC (place lablp)
#   Lab boards libdatax has no device family for (AD9081, ADRV9371, DAQ3) are
#   not tested here; see docs/hardware.md.
#
# First green run on main: 43033512607 (2026-11-11), evidence in docs/evidence/ci/.
name: hw-test
on:
  workflow_dispatch:
    inputs:
      place:
        description: Board to test
        type: choice
        options: [all, tron, zc706, lablp]
        default: all
      image:
        description: tron image(s) to boot
        type: choice
        options: [both, stock, hopcap-sfp]
        default: both
  schedule:
    # Sundays and Wednesdays (one busy board must not cost a whole week); offset
    # from the hopcap and vrt49 nightlies that share tron.
    - cron: "0 13 * * 0,3"
permissions:
  contents: read

jobs:
  tron:
    if: github.event_name == 'schedule' || inputs.place == 'tron' || inputs.place == 'all'
    runs-on: [self-hosted, hw-nemo]
    timeout-minutes: 150
    concurrency:
      group: libdatax-hw-tron
      cancel-in-progress: false
    env:
      IMAGE: ${{ inputs.image || 'both' }}
      OUT: ${{ github.workspace }}/hw-out
    steps:
      - uses: actions/checkout@v4
      - name: Build the pinned libiio v1
        run: |
          rev=$(jq -r .libiio.revision pins.json)
          rm -rf libiio
          git clone --filter=blob:none https://github.com/tfcollins/libiio libiio
          git -C libiio checkout "$rev"
          cmake -S libiio -B libiio/build -DWITH_EMU_BACKEND=ON -DWITH_IIOD_EMU=ON \
            -DWITH_TESTS=OFF -DWITH_DOC=OFF -DWITH_USB_BACKEND=OFF \
            -DWITH_SERIAL_BACKEND=OFF -DHAVE_DNS_SD=OFF -DWITH_EXAMPLES=OFF
          cmake --build libiio/build -j"$(nproc)"
      - name: Build libdatax
        run: |
          cmake -S . -B build -DDATAX_LIBIIO_SOURCE=libiio -DDATAX_LIBIIO_BUILD=libiio/build
          cmake --build build -j"$(nproc)"
      - name: Lab venv (libdatax, hopcap lab boot, labgrid-plugins at pins.json)
        run: |
          pin() { echo "git+https://github.com/$(jq -r ".$1.repository" pins.json)@$(jq -r ".$1.revision" pins.json)"; }
          rm -rf .venv-hw
          uv venv .venv-hw
          uv pip install --python .venv-hw/bin/python -e . numpy pytest \
            "hopcap[lab] @ $(pin hopcap)" "labgrid-plugins @ $(pin labgrid_plugins)"
      - name: tron, stock image
        if: env.IMAGE != 'hopcap-sfp'
        run: scripts/hw/tron-run.sh stock "$OUT"
      - name: tron, hopcap-sfp image
        if: (success() || failure()) && env.IMAGE != 'stock'
        run: scripts/hw/tron-run.sh hopcap-sfp "$OUT"
      - name: Redact outputs
        if: always()
        run: test -d "$OUT" && python3 scripts/hw/redact.py "$OUT" && rm -f "$OUT"/*.raw.log || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hw-tron
          path: |
            hw-out/*.json
            hw-out/*.xml
            hw-out/*.log
          if-no-files-found: ignore

  kuiper:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: zc706, part: adrv9009, carrier: zc706 }
          - { name: lablp, part: adrv9361z7035, carrier: adrv1crr-fmc }
    if: >-
      github.event_name == 'schedule' || inputs.place == 'all' ||
      inputs.place == 'zc706' || inputs.place == 'lablp'
    runs-on: [self-hosted, hw-nemo]
    timeout-minutes: 90
    concurrency:
      group: libdatax-hw-${{ matrix.name }}
      cancel-in-progress: false
    env:
      OUT: ${{ github.workspace }}/hw-out
      SELECTED: ${{ github.event_name == 'schedule' || inputs.place == 'all' || inputs.place == matrix.name }}
    steps:
      - uses: actions/checkout@v4
        if: env.SELECTED == 'true'
      - name: Build the pinned libiio v1
        if: env.SELECTED == 'true'
        run: |
          rev=$(jq -r .libiio.revision pins.json)
          rm -rf libiio
          git clone --filter=blob:none https://github.com/tfcollins/libiio libiio
          git -C libiio checkout "$rev"
          cmake -S libiio -B libiio/build -DWITH_EMU_BACKEND=ON -DWITH_IIOD_EMU=ON \
            -DWITH_TESTS=OFF -DWITH_DOC=OFF -DWITH_USB_BACKEND=OFF \
            -DWITH_SERIAL_BACKEND=OFF -DHAVE_DNS_SD=OFF -DWITH_EXAMPLES=OFF
          cmake --build libiio/build -j"$(nproc)"
      - name: Build libdatax
        if: env.SELECTED == 'true'
        run: |
          cmake -S . -B build -DDATAX_LIBIIO_SOURCE=libiio -DDATAX_LIBIIO_BUILD=libiio/build
          cmake --build build -j"$(nproc)"
      - name: Lab venv (libdatax, labgrid-plugins at pins.json)
        if: env.SELECTED == 'true'
        run: |
          pin() { echo "git+https://github.com/$(jq -r ".$1.repository" pins.json)@$(jq -r ".$1.revision" pins.json)"; }
          rm -rf .venv-hw
          uv venv .venv-hw
          uv pip install --python .venv-hw/bin/python -e . numpy pytest \
            "labgrid-plugins @ $(pin labgrid_plugins)"
      - name: ${{ matrix.name }}, catalog Kuiper image
        if: env.SELECTED == 'true'
        run: scripts/hw/kuiper-run.sh ${{ matrix.name }} ${{ matrix.part }} ${{ matrix.carrier }} "$OUT"
      - name: Redact outputs
        if: always() && env.SELECTED == 'true'
        run: test -d "$OUT" && python3 scripts/hw/redact.py "$OUT" && rm -f "$OUT"/*.raw.log || true
      - uses: actions/upload-artifact@v4
        if: always() && env.SELECTED == 'true'
        with:
          name: hw-${{ matrix.name }}
          path: |
            hw-out/*.json
            hw-out/*.xml
            hw-out/*.log
          if-no-files-found: ignore
